apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-app.fullname" . }}-postgres-headless
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "demo-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-app.fullname" . }}-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    {{- include "demo-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
