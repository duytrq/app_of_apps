apiVersion: v1
kind: Pod
metadata:
  name: "{{ template "helm-guestbook.fullname" . }}-test-connection"
  labels:
    app: {{ template "helm-guestbook.name" . }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ template "helm-guestbook.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never

